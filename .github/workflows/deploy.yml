
name: Build and Deploy Frontend to EC2

on:
  push:
    branches:
      - code-review-fe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v6

      # 2. Validate GitHub Secrets
      - name: Validate Secrets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          for secret in DOCKERHUB_USERNAME DOCKERHUB_TOKEN EC2_HOST EC2_USER EC2_SSH_KEY
          do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing GitHub secret: $secret"
              exit 1
            fi
          done

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Set up QEMU
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # 5. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 6. Build and push ARM64 Docker image
      - name: Build and Push ARM64 Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-practice-fe:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-practice-fe:${{ github.sha }}

      # 7. Deploy frontend to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Starting deployment..."

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-practice-fe:${{ github.sha }}"
            NETWORK="practice-app_default"

            # Check Docker network
            echo "Checking Docker network..."

            if ! docker network inspect "$NETWORK" >/dev/null 2>&1; then
              echo "Error: Backend Docker network does not exist!"
              exit 1
            fi

            # Pull latest image
            echo "Pulling Docker image..."
            docker pull "$IMAGE"

            # Remove old frontend container
            echo "Removing old frontend container..."
            docker rm -f java-frontend 2>/dev/null || true

            # Start frontend on backend network
            echo "Starting frontend container..."

            docker run -d \
              --name java-frontend \
              --restart unless-stopped \
              --network "$NETWORK" \
              -p 80:80 \
              "$IMAGE"

            # Verify Nginx configuration
            echo "Checking Nginx configuration..."
            sleep 3
            docker exec java-frontend nginx -t

            # Verify backend API through Nginx
            echo "Testing backend API connection..."

            if ! curl --fail --silent --show-error http://localhost/api/student >/dev/null; then
              echo "Backend API connection failed!"
              docker logs java-frontend
              exit 1
            fi

            # Deployment status
            echo "Checking running containers..."
            docker ps --filter "name=java-frontend"

            echo "Backend API connection successful!"
            echo "Deployment completed successfully!"
