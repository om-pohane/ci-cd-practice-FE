
name: Build and Deploy Frontend to EC2

on:
  push:
    branches:
      - code-review-fe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v6

      # 2. Validate required GitHub secrets
      - name: Validate Secrets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          for secret in DOCKERHUB_USERNAME DOCKERHUB_TOKEN EC2_HOST EC2_USERNAME EC2_SSH_KEY
          do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing GitHub secret: $secret"
              exit 1
            fi
          done

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Enable ARM64 support
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # 5. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 6. Build ARM64 image and push to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-practice-fe:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-practice-fe:${{ github.sha }}

      # 7. Deploy on EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Starting deployment..."

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-practice-fe:${{ github.sha }}"

            echo "Pulling ARM64 Docker image..."
            docker pull "$IMAGE"

            echo "Removing old container..."
            docker rm -f java-frontend 2>/dev/null || true

            echo "Starting new container..."
            docker run -d \
              --name java-frontend \
              --restart unless-stopped \
              -p 80:80 \
              "$IMAGE"

            echo "Waiting for container to start..."
            sleep 5

            echo "Checking container status..."
            docker ps --filter "name=java-frontend"

            echo "Deployment completed successfully!"
